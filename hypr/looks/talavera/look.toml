# discada — look «talavera»
# Lo único que hay que tocar para cambiar sus colores, fuente o estilo:
# los archivos de cada app (empalme/, rofi/, hypr/…) usan estos nombres.
# LookBuild.py lo aplica (lo llama LookSwitch.sh).

[about]
es = "loza de Puebla: esmalte crema y trazo cobalto"
en = "Puebla pottery: cream glaze and cobalt linework"

[font]
family = "MonaspiceXe Nerd Font"   # {{font}} en los archivos del look
package = "otf-monaspace-nerd"   # lo instala install.sh

[colors]
from = "palette"   # sus propios colores (no los del wallpaper)
# los de la terminal: kitty, vato, taco, arre, nvim, GTK/Qt…
background = "#f6f1e4"
foreground = "#1b2340"
cursor = "#1f3f8f"
color0 = "#1b2340"
color1 = "#b5532a"
color2 = "#3f8a5a"
color3 = "#a87410"
color4 = "#1f3f8f"
color5 = "#7a3f8f"
color6 = "#1f7480"
color7 = "#6b7391"
color8 = "#3b4466"
color9 = "#c9673c"
color10 = "#4e9f6a"
color11 = "#c48a14"
color12 = "#2f5bb8"
color13 = "#9150a8"
color14 = "#2a8a96"
color15 = "#2b3355"

[colors.named]
# nombres propios del look (@acc en css y rofi, $acc en hyprland…);
# el valor es un color o el nombre de otro (color12, background…)
bg0 = "background"
bg1 = "#ece4d0"
bg2 = "#d9ccb0"
bg3 = "color4"
dim = "color7"
fg = "foreground"
hi = "#0e1530"
acc = "color4"
acc2 = "#e3a51b"
warn = "color1"
ok = "color2"
alt = "color12"
cool = "color12"
bg = "background"
line = "#d9ccb0"
ink = "color4"
rust = "#b5562f"

[style]
# cómo se ven rola, vato, taco, arre y nvim (ver el README de vato)
borders = "rounded"
bar = "knob"
labels = "icons"
case = "normal"
select = "fill"
tint = "color"
transparent = false

[wallust]
palette = "light16"

[kitty]
# lo que el tema de kitty del look tiene además de la paleta (selección, pestañas…)
selection_foreground = "bg0"
selection_background = "bg3"
url_color = "alt"
cursor_text_color = "bg0"
active_border_color = "bg3"
inactive_border_color = "bg2"
active_tab_foreground = "bg0"
active_tab_background = "bg3"
inactive_tab_foreground = "dim"
inactive_tab_background = "bg1"

[bar]
# empalme, la barra de discada: módulos, formatos y estilo (empalme/src/style.rs)
position = "top"
height = 34
margin = [16, 16, 0, 16]     # arriba, derecha, abajo, izquierda (pixeles)
style = "solid"
radius = 0
font-size = 13     # pixeles
pad = 0                # el relleno de cada módulo va en su padding (pixeles)
gap = 0                # celdas entre módulos
spacing = 4            # pixeles entre módulos
left = ["workspaces", "visualizer", "app#i1", "app#i2", "app#i3", "app#i4", "app#i5", "app#i6", "app#i7", "app#i8", "group/apps"]
center = ["clock"]
right = ["recorder", "group/mobo_drawer", "group/audio", "network", "bluetooth", "battery", "idle", "group/notify", "power"]

[bar.box]
bg = "alpha(bg0, 0.9)"
border = "acc"
"border-width" = 2
"border-sides" = "all"
radius = 18

[bar.modules.workspaces]
format = "{icon}"
"format-icons" = { "active" = "󰉊", "default" = "󰧰", "empty" = "󰧟" }
persistent = 5
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 6, 3, 6]
padding = 4
fg = "alpha(acc, 0.6)"
"empty-fg" = "bg2"
"active-fg" = "acc2"
"active-bg" = "acc"
"button-padding" = 9
"button-radius" = 12
"font-size" = 16

[bar.modules.clock]
format = "<span foreground=\"#e3a51b\">󰫢</span> {:%H:%M}"
"format-alt" = "<span foreground=\"#1f3f8f\">{:%A %d · %B}</span>"
"tooltip-format" = "<tt><small>{calendar}</small></tt>"
calendar = { "format" = { "today" = "<b><u>{}</u></b>" } }
fg = "acc"
bg = "bg0"
border = "acc"
"border-width" = 2
radius = 14
margin = [3, 2, 3, 2]
padding = 16
bold = true
"font-size" = 14

[bar.modules.temperature]
tooltip = true
"format-critical" = "󰈸 {temperatureC}°"
format = "󰔏 {temperatureC}°"
"format-icons" = ["󰈸"]
interval = 10
"critical-threshold" = 82
fg = "dim"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.cpu]
format = "󰘚 {usage}%"
"format-alt" = "󰘚 {icon0}{icon1}{icon2}{icon3}"
"format-icons" = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
interval = 1
fg = "dim"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.memory]
format = "󰍛 {used:0.1f}G"
"format-alt" = "󰍛 {percentage}%"
tooltip = true
"tooltip-format" = "{used:0.1f}GB/{total:0.1f}G"
interval = 10
fg = "dim"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.disk]
format = "󰋊 {percentage_used}%"
"tooltip-format" = "{used} used out of {total} on {path} ({percentage_used}%)"
interval = 30
path = "/"
fg = "dim"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.audio]
format = "󰕾 {volume}"
"format-muted" = "󰖁"
"format-bluetooth" = "󰂯 {volume}"
"tooltip-format" = "{icon} {desc} | {volume}%"
"format-icons" = { "headphone" = "", "hands-free" = "", "headset" = "", "phone" = "", "portable" = "", "car" = "", "default" = ["", "", "󰕾", ""] }
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.mic]
format = "󰍬 {volume}"
"format-muted" = "󰍭"
"tooltip-format" = "{source_desc} | {source_volume}%"
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.network]
format = "󰖩"
"format-wifi" = "󰖩 {signalStrength}"
"format-ethernet" = "󰌗"
"format-disconnected" = "󰖪"
"tooltip-format" = "{ipaddr}  {bandwidthUpBits}  {bandwidthDownBits}"
"format-linked" = "󰈁 {ifname} (No IP)"
"tooltip-format-wifi" = "{essid} {icon} {signalStrength}%"
"tooltip-format-ethernet" = "{ifname} 󰌘"
"tooltip-format-disconnected" = "󰌙 Disconnected"
"format-icons" = ["󰤯", "󰤟", "󰤢", "󰤥", "󰤨"]
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10
"font-size" = 17

[bar.modules.bluetooth]
format = "󰂯"
"format-disabled" = "󰂲"
"format-connected" = "󰂱 {num_connections}"
"tooltip-format" = " {device_alias}"
"tooltip-format-connected" = "{device_enumerate}"
"tooltip-format-enumerate-connected" = " {device_alias} 󰂄{device_battery_percentage}%"
tooltip = true
"format-off" = "󰂲"
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10
"font-size" = 17

[bar.modules.idle]
tooltip = true
"tooltip-format-activated" = "Stay awake: on\nScreen won't dim, lock or sleep"
"tooltip-format-deactivated" = "Stay awake: off\nClick to keep the screen on"
format = "{icon}"
"format-icons" = { "activated" = "󰅶", "deactivated" = "󰒲" }
fg = "ok"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10
"font-size" = 17

[bar.modules.notifications]
format = "{} {icon} "
"format-icons" = { "notification" = "<span foreground='red'><sup></sup></span>", "none" = "", "dnd-notification" = "<span foreground='red'><sup></sup></span>", "dnd-none" = "" }
fg = "fg"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.recorder]
rec = "󰻃"
paused = "󰏦"
replay = "󰧰"
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10

[bar.modules.power]
format = " 󰐥 "
tooltip = true
"tooltip-format" = "Left Click: Logout Menu\nRight Click: Change Blur"
fg = "bg0"
bg = "acc"
border = "acc"
"border-width" = 1
radius = 14
margin = [3, 4, 3, 2]
padding = 10
"font-size" = 17

[bar.modules.battery]
format = "{icon} {percentage}"
"format-icons" = { "discharging" = ["󰁺", "󰁻", "󰁼", "󰁽", "󰁾", "󰁿", "󰂀", "󰂁", "󰂂", "󰁹"], "charging" = ["󰢜", "󰂆", "󰂇", "󰂈", "󰢝", "󰂉", "󰢞", "󰂊", "󰂋", "󰂅"], "full" = ["󰚥"], "saver" = ["󰌪"] }
"low-color" = "warn"
"critical-color" = "warn"
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 10
"font-size" = 17

[bar.modules.visualizer]
style = "braille"
bars = 16
padding = 6
"font-size" = 14
color = "acc"

[bar.modules.app]
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 6
"font-size" = 17
color = "acc"
"active-border" = "acc"

[bar.modules."app#more"]
fg = "acc"
bg = "bg1"
border = "alpha(acc, 0.35)"
"border-width" = 1
radius = 14
margin = [3, 2, 3, 2]
padding = 6
"font-size" = 17

[bar.hover]
bg = "bg0"
modules = ["power", "audio", "mic", "network", "bluetooth", "battery", "notifications"]

[bar.hover-workspaces]
fg = "acc"
bg = "bg2"

[bar.tooltip]
bg = "bg0"
border = "acc"
radius = 12
fg = "fg"

[bar.groups.apps]
modules = ["app#more", "app#d1", "app#d2", "app#d3", "app#d4", "app#d5", "app#d6", "app#d7", "app#d8"]
drawer = { "transition-duration" = 250, "transition-left-to-right" = true }

[bar.groups.mobo_drawer]
modules = ["temperature", "cpu", "memory", "disk"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = true }

[bar.groups.audio]
modules = ["audio", "mic"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = true }

[bar.groups.notify]
modules = ["notifications"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = false }
