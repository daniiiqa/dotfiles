# Look talavera — hyprlock: plato de talavera: hora en cobalto sobre esmalte crema, ornamento ocre,
# "talavera · puebla" abajo.
# Paleta fija.

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$font = {{font}}

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $bg0

    blur_size = 4
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# el plato
shape {
    monitor =
    size = 520, 560
    color = $bg0_af0
    rounding = 20
    border_size = 3
    border_color = $bg3
    position = 0, 40
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = ❖ ✦ ❖
    color = $acc2
    font_size = 20
    font_family = $font
    position = 0, 230
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = talavera · puebla
    color = $bg3
    font_size = 16
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
    zindex = 1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $bg3
    font_size = 120
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
    zindex = 1
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d · %B')"
    color = $dim
    font_size = 18
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 20
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    outer_color = $bg3
    inner_color = $bg1_aeb
    font_color = $fg
    check_color = $acc2
    fail_color = $warn
    capslock_color = $acc2
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##6b7391">contraseña</span>
    fail_text = <span foreground="##b5532a">se despostilló</span>
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
    zindex = 1
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = $fg_a73
    font_size = 12
    font_family = $font
    position = 50, 40
    halign = left
    valign = bottom
}
