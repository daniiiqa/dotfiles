# Look talavera: suaves y redondas, como esmalte que se asienta — popin
# desde 90% con un rebote mínimo.
animations {
  enabled = yes

  bezier = glaze, 0.22, 1.15, 0.36, 1
  bezier = settle, 0.4, 0, 0.2, 1

  animation = windows, 1, 4, glaze, popin 90%
  animation = windowsOut, 1, 3, settle, popin 90%
  animation = windowsMove, 1, 4, glaze
  animation = border, 1, 6, settle
  animation = borderangle, 0
  animation = fade, 1, 4, settle
  animation = layers, 1, 3, glaze, fade
  animation = workspaces, 1, 5, settle, slidefade 15%
  animation = specialWorkspace, 1, 4, glaze, slidevert
}
