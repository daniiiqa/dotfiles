# Look talavera: azulejo: borde cobalto, esquinas redondas, sombra azulada suave.
# Paleta fija (no sigue al wallpaper).


source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 6
  gaps_out = 14

  col.active_border = $acc $alt 45deg
  col.inactive_border = $line
}

decoration {
  rounding = 14
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.97
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.06
  dim_special = 0.5

  shadow {
    enabled = true
    range = 20
    render_power = 3
    offset = 0 6
    sharp = false
    color = $bg3_a33
    color_inactive = $bg3_a22
  }

  blur {
    enabled = true
    size = 6
    passes = 2
    noise = 0.02
    brightness = 1.05
    vibrancy = 0.15
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $acc
  col.border_inactive = $line

  groupbar {
    col.active = $acc
    col.inactive = $line
  }
}

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.2
layerrule = match:namespace logout_dialog, blur on
