# Look outsider: lentas y suaves, como cinta que arranca — fades largos,
# ventanas que aparecen desde 92% sin rebote.
animations {
  enabled = yes

  bezier = tape, 0.33, 0, 0.15, 1
  bezier = drift, 0.45, 0, 0.55, 1

  animation = windows, 1, 5, tape, popin 92%
  animation = windowsOut, 1, 4, drift, popin 92%
  animation = windowsMove, 1, 5, tape
  animation = border, 1, 8, drift
  animation = borderangle, 0
  animation = fade, 1, 6, drift
  animation = layers, 1, 4, tape, fade
  animation = workspaces, 1, 6, drift, fade
  animation = specialWorkspace, 1, 5, tape, slidevert
}
