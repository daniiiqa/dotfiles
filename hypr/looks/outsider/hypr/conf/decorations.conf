# Look outsider: outsider house / lo-fi — foto vieja de rollo, cassette y VHS.
# Paleta fija (no sigue al wallpaper): negros cálidos, crema, rosa deslavado,
# teal de cinta y el rojo del REC. Grano de película con screen_shader.


source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  gaps_in = 3
  gaps_out = 8

  col.active_border = $rose $amber 45deg
  col.inactive_border = $ink2
}

decoration {
  rounding = 3
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.93
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.06
  dim_special = 0.5

  # grano + negros levantados + viñeta leve. GameMode.sh lo apaga.
  screen_shader = ~/.config/hypr/shaders/outsider.frag

  shadow {
    enabled = true
    range = 22
    render_power = 2
    offset = 0 8
    color = rgba(0a080699)
    color_inactive = rgba(0a080644)
  }

  blur {
    enabled = true
    size = 5
    passes = 2
    noise = 0.06
    brightness = 0.9
    vibrancy = 0.05
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $rose
  col.border_inactive = $ink2

  groupbar {
    col.active = $rose
    col.inactive = $ink3
  }
}

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.2
layerrule = match:namespace logout_dialog, blur on
