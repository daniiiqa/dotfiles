# Look outsider — hyprlock: como una pausa de VHS. Fondo oscurecido y
# granuloso, "▌▌ pause" arriba a la izquierda, sello de fecha de camcorder
# abajo a la derecha, hora grande en crema. Paleta fija.

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$ink1 = rgba(1f1b16dd)
$font = {{font}}

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $ink0

    blur_size = 3
    blur_passes = 2
    noise = 0.06
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ▌▌ pause, esquina de VHS
label {
    monitor =
    text = ▌▌ pause
    color = $cream
    font_size = 22
    font_family = $font
    position = 50, -40
    halign = left
    valign = top
}

# ● rec en la otra esquina
label {
    monitor =
    text = <span foreground="##d4523b">●</span> sp  0:00:00
    color = $cream
    font_size = 16
    font_family = $font
    position = -50, -44
    halign = right
    valign = top
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $cream
    font_size = 120
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# Sello de fecha de camcorder
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=C date +'%b %-d %Y' | tr a-z A-Z)"
    color = $amber
    font_size = 20
    font_family = $font
    position = -50, 40
    halign = right
    valign = bottom
}

# Input
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 3
    dots_size = 0.16
    dots_spacing = 0.45
    dots_center = true
    outer_color = $ink3
    inner_color = $ink1
    font_color = $cream
    check_color = $rose
    fail_color = $rec
    capslock_color = $amber
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##8f8574">press play</span>
    fail_text = <span foreground="##d4523b">tracking error</span>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = $cream_a66
    font_size = 12
    font_family = $font
    position = 50, 40
    halign = left
    valign = bottom
}
