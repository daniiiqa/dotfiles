# discada — look «outsider»
# Lo único que hay que tocar para cambiar sus colores, fuente o estilo:
# los archivos de cada app (empalme/, rofi/, hypr/…) usan estos nombres.
# LookBuild.py lo aplica (lo llama LookSwitch.sh).

[about]
es = "lo-fi de cassette, minúsculas, grano de película"
en = "lo-fi cassette, lowercase, film grain"

[font]
family = "FantasqueSansM Nerd Font"   # {{font}} en los archivos del look
package = "ttf-fantasque-nerd"   # lo instala install.sh

[colors]
from = "palette"   # sus propios colores (no los del wallpaper)
# los de la terminal: kitty, vato, taco, arre, nvim, GTK/Qt…
background = "#15120e"
foreground = "#e8dcc3"
cursor = "#d99a8b"
color0 = "#2d2820"
color1 = "#d4523b"
color2 = "#9aa56f"
color3 = "#e3b161"
color4 = "#6f8fa0"
color5 = "#c58a9c"
color6 = "#87aaa1"
color7 = "#e8dcc3"
color8 = "#4d453a"
color9 = "#e07a63"
color10 = "#b3bd88"
color11 = "#efc988"
color12 = "#8fb0c0"
color13 = "#d99a8b"
color14 = "#a6c4bb"
color15 = "#f3ead6"

[colors.named]
# nombres propios del look (@acc en css y rofi, $acc en hyprland…);
# el valor es un color o el nombre de otro (color12, background…)
ink0 = "background"
ink1 = "#1f1b16"
ink2 = "color0"
ink3 = "color8"
dust = "#8f8574"
cream = "foreground"
paper = "color15"
rose = "color13"
teal = "color6"
amber = "color3"
rec = "color1"

[style]
# cómo se ven rola, vato, taco, arre y nvim (ver el README de vato)
borders = "plain"
bar = "dots"
labels = "words"
case = "lower"
select = "fill"
tint = "color"
transparent = true

[wallust]
palette = "dark16"

[kitty]
# lo que el tema de kitty del look tiene además de la paleta (selección, pestañas…)
selection_foreground = "ink0"
selection_background = "rose"
url_color = "teal"
cursor_text_color = "ink0"
active_border_color = "rose"
inactive_border_color = "ink2"
active_tab_foreground = "ink0"
active_tab_background = "rose"
inactive_tab_foreground = "dust"
inactive_tab_background = "ink1"

[bar]
# empalme, la barra de discada: módulos, formatos y estilo (empalme/src/style.rs)
position = "top"
height = 30
margin = [9, 14, 0, 14]     # arriba, derecha, abajo, izquierda (pixeles)
style = "solid"
radius = 0
font-size = 14     # pixeles
pad = 0                # el relleno de cada módulo va en su padding (pixeles)
gap = 0                # celdas entre módulos
spacing = 0            # pixeles entre módulos
left = ["workspaces", "visualizer", "app#i1", "app#i2", "app#i3", "app#i4", "app#i5", "app#i6", "app#i7", "app#i8", "group/apps"]
center = ["clock"]
right = ["recorder", "group/mobo_drawer", "group/audio", "network", "bluetooth", "battery", "idle", "group/notify", "power"]

[bar.box]
bg = "alpha(ink0, 0.9)"
border = "ink2"
"border-width" = 1
"border-sides" = "all"
radius = 3

[bar.modules.workspaces]
format = "{icon}"
"format-icons" = { "1" = "01", "2" = "02", "3" = "03", "4" = "04", "5" = "05", "6" = "06", "7" = "07", "8" = "08", "9" = "09", "10" = "10", "default" = "··" }
persistent = 5
margin = [0, 4, 0, 4]
fg = "dust"
"empty-fg" = "ink3"
"active-fg" = "paper"
"button-padding" = 11
"active-line" = "top"
"active-color" = "rose"

[bar.modules.clock]
format = "<span foreground=\"#d4523b\">●</span> rec  {:%H:%M}"
"format-alt" = "<span foreground=\"#e3b161\">{:%b %d %Y   %H:%M}</span>"
"tooltip-format" = "<tt><small>{calendar}</small></tt>"
calendar = { "format" = { "today" = "<b><u>{}</u></b>" } }
fg = "paper"
padding = 14
"font-size" = 15

[bar.modules.temperature]
tooltip = true
"format-critical" = "{temperatureC}°C {icon}"
format = "{temperatureC}°"
"format-icons" = ["󰈸"]
interval = 10
"critical-threshold" = 82
fg = "teal"
padding = 8

[bar.modules.cpu]
format = "cpu {usage}%"
"format-alt" = "cpu {icon0}{icon1}{icon2}{icon3}"
"format-icons" = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
interval = 1
fg = "teal"
padding = 8

[bar.modules.memory]
format = "mem {used:0.1f}g"
"format-alt" = "mem {percentage}%"
tooltip = true
"tooltip-format" = "{used:0.1f}GB/{total:0.1f}G"
interval = 10
fg = "teal"
padding = 8

[bar.modules.disk]
format = "hdd {percentage_used}%"
"tooltip-format" = "{used} used out of {total} on {path} ({percentage_used}%)"
interval = 30
path = "/"
fg = "teal"
padding = 8

[bar.modules.audio]
format = "vol {volume}"
"format-muted" = "vol --"
"format-bluetooth" = "{icon} 󰂰 {volume}%"
"tooltip-format" = "{icon} {desc} | {volume}%"
"format-icons" = { "headphone" = "", "hands-free" = "", "headset" = "", "phone" = "", "portable" = "", "car" = "", "default" = ["", "", "󰕾", ""] }
fg = "cream"
padding = 8

[bar.modules.mic]
format = " {volume}%"
"format-muted" = ""
"tooltip-format" = "{source_desc} | {source_volume}%"
fg = "cream"
padding = 8

[bar.modules.network]
format = "net"
"format-wifi" = "wifi {signalStrength}"
"format-ethernet" = "lan"
"format-disconnected" = "offline"
"tooltip-format" = "{ipaddr}  {bandwidthUpBits}  {bandwidthDownBits}"
"format-linked" = "󰈁 {ifname} (No IP)"
"tooltip-format-wifi" = "{essid} {icon} {signalStrength}%"
"tooltip-format-ethernet" = "{ifname} 󰌘"
"tooltip-format-disconnected" = "󰌙 Disconnected"
"format-icons" = ["󰤯", "󰤟", "󰤢", "󰤥", "󰤨"]
fg = "cream"
padding = 8

[bar.modules.bluetooth]
format = "bt"
"format-disabled" = "bt"
"format-connected" = "bt {num_connections}"
"tooltip-format" = " {device_alias}"
"tooltip-format-connected" = "{device_enumerate}"
"tooltip-format-enumerate-connected" = " {device_alias} 󰂄{device_battery_percentage}%"
tooltip = true
"format-off" = "bt"
fg = "cream"
padding = 8

[bar.modules.idle]
tooltip = true
"tooltip-format-activated" = "Stay awake: on\nScreen won't dim, lock or sleep"
"tooltip-format-deactivated" = "Stay awake: off\nClick to keep the screen on"
format = "{icon}"
"format-icons" = { "activated" = "awake", "deactivated" = "zz" }
fg = "dust"
padding = 8

[bar.modules.notifications]
format = "{} {icon} "
"format-icons" = { "notification" = "<span foreground='red'><sup></sup></span>", "none" = "", "dnd-notification" = "<span foreground='red'><sup></sup></span>", "dnd-none" = "" }
fg = "cream"
padding = 8

[bar.modules.recorder]
rec = "rec"
paused = "hold"
replay = "tape"
fg = "rose"
padding = 8

[bar.modules.power]
format = " ⏏ "
tooltip = true
"tooltip-format" = "Left Click: Logout Menu\nRight Click: Change Blur"
fg = "rec"
margin = [0, 2, 0, 0]
padding = 8

[bar.modules.battery]
format = "{icon} {percentage}"
"format-icons" = { "discharging" = ["bat"], "charging" = ["bat+"], "full" = ["ac"], "saver" = ["eco"] }
"low-color" = "rec"
"critical-color" = "rec"
fg = "cream"
padding = 8

[bar.modules.visualizer]
style = "chars"
bars = 10
chars = ".:-=+*#"
padding = 6
color = "rose"

[bar.modules.app]
padding = 6
"font-size" = 20
color = "rose"
"active-line" = "top"
"active-color" = "rose"

[bar.modules."app#more"]
fg = "rose"
padding = 6
"font-size" = 20

[bar.hover]
bg = "ink1"
modules = ["power", "audio", "mic", "network", "bluetooth", "battery", "notifications"]

[bar.hover-workspaces]
fg = "cream"
bg = "ink1"

[bar.tooltip]
bg = "ink0"
border = "ink3"
radius = 3
fg = "cream"

[bar.groups.apps]
modules = ["app#more", "app#d1", "app#d2", "app#d3", "app#d4", "app#d5", "app#d6", "app#d7", "app#d8"]
drawer = { "transition-duration" = 250, "transition-left-to-right" = true }

[bar.groups.mobo_drawer]
modules = ["temperature", "cpu", "memory", "disk"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = true }

[bar.groups.audio]
modules = ["audio", "mic"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = true }

[bar.groups.notify]
modules = ["notifications"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = false }
