# Look brutalist — hyprlock: reloj grande y seco, input recto con línea de 2px.
# Colores vía wallust; acento = color12.

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$font = {{font}}

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $background

    blur_size = 0
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 0.35
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 120
    font_family = $font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%a %d %b %Y')"
    color = rgba(255, 255, 255, 0.55)
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true
    outer_color = $foreground
    inner_color = $background
    font_color = $foreground
    check_color = $color12
    fail_color = $critical
    capslock_color = $color11
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##ffffff66">$USER</span>
    fail_text = <span foreground="##e06c75">$FAIL</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# Layout de teclado, abajo y discreto
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
