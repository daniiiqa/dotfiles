# Look brutalist: editorial y afilado — esquinas rectas, líneas de 2px,
# sombra dura corta, cero blur. Colores de wallust (paleta harddark16).

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 8

  col.active_border = $color12
  col.inactive_border = rgba(ffffff14)
}

decoration {
  rounding = 0

  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.12
  dim_special = 0.6

  shadow {
    enabled = true
    range = 1
    render_power = 1
    sharp = true
    offset = 4 4
    color = rgba(000000cc)
    color_inactive = rgba(00000066)
  }

  blur {
    enabled = false
  }
}

group {
  col.border_active = $color12
  col.border_inactive = rgba(ffffff14)

  groupbar {
    col.active = $color12
    col.inactive = $color0
  }
}
