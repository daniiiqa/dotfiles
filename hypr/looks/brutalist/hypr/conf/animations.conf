# Look brutalist: movimiento seco — curvas lineales y muy cortas, sin easing
animations {
  enabled = yes

  bezier = cut, 0.9, 0, 0.1, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 1.5, cut, slide
  animation = windowsIn, 1, 1.5, cut, slide
  animation = windowsOut, 1, 1, liner, slide
  animation = windowsMove, 1, 1.5, cut
  animation = border, 1, 1, liner
  animation = borderangle, 0
  animation = fade, 1, 1, liner
  animation = layers, 1, 1.5, cut, slide
  animation = workspaces, 1, 2, cut, slide
  animation = specialWorkspace, 1, 2, cut, slidevert
}
