# discada — look «retro»
# Lo único que hay que tocar para cambiar sus colores, fuente o estilo:
# los archivos de cada app (waybar/, rofi/, hypr/…) usan estos nombres.
# LookBuild.py lo aplica (lo llama LookSwitch.sh).

[about]
es = "terminal de fósforo, todo en texto"
en = "phosphor terminal, all text"

[font]
family = "Terminess Nerd Font"   # {{font}} en los archivos del look
package = "ttf-terminus-nerd"   # lo instala install.sh

[colors]
from = "wallpaper"   # wallust los saca del wallpaper (color0…color15)

[colors.named]
# nombres propios del look (@acc en css y rofi, $acc en hyprland…);
# el valor es un color o el nombre de otro (color12, background…)
critical = "#e06c75"
rec = "#ff5555"

[style]
# cómo se ven rola, vato, taco, arre y nvim (ver el README de vato)
transparent = false
borders = "dashed"
bar = "ascii"
labels = "short"
case = "normal"
select = "inverse"
tint = "phosphor"

[wallust]
palette = "dark16"

[bar]
# empalme, la barra de discada (traducido de waybar/config)
position = "top"
height = 26
margin = [0, 0, 0, 0]     # arriba, derecha, abajo, izquierda (pixeles)
style = "solid"
radius = 0
font-size = 12     # pixeles, como en el style.css de waybar
pad = 1                # celdas a cada lado de un módulo
gap = 0                # celdas entre módulos
left = ["workspaces"]
center = ["clock"]
right = ["recorder", "temperature", "cpu", "memory", "disk", "audio", "mic", "network", "bluetooth", "battery", "idle", "notifications", "power"]

[bar.modules.clock]
format = "[ {:%H:%M:%S} ]"
"format-alt" = "[ {:%Y-%m-%d %a} ]"

[bar.modules.temperature]
"format-critical" = "tmp {temperatureC}c!"
format = "tmp {temperatureC}c"
"format-icons" = ["󰈸"]
interval = 10
"critical-threshold" = 82

[bar.modules.cpu]
format = "cpu {usage}%"
"format-alt" = "cpu {icon0}{icon1}{icon2}{icon3}"
"format-icons" = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
interval = 1

[bar.modules.memory]
format = "mem {used:0.1f}g"
"format-alt" = "mem {percentage}%"
interval = 10

[bar.modules.disk]
format = "dsk {percentage_used}%"
interval = 30
path = "/"

[bar.modules.audio]
format = "vol {volume}%"
"format-muted" = "vol --"
"format-bluetooth" = "vol(bt) {volume}%"
"format-icons" = { "headphone" = "", "hands-free" = "", "headset" = "", "phone" = "", "portable" = "", "car" = "", "default" = ["", "", "󰕾", ""] }

[bar.modules.mic]
format = "mic {volume}%"
"format-muted" = "mic --"

[bar.modules.network]
format = "{ifname}"
"format-wifi" = "net {signalStrength}%"
"format-ethernet" = "net up"
"format-disconnected" = "net --"
"format-linked" = "net ??"
"format-icons" = ["󰤯", "󰤟", "󰤢", "󰤥", "󰤨"]

[bar.modules.bluetooth]
format = "bt"
"format-disabled" = "bt --"
"format-connected" = "bt {num_connections}"

[bar.modules.idle]
format = "{icon}"
"format-icons" = { "activated" = "caf+", "deactivated" = "caf-" }

[bar.modules.notifications]
format = "{icon}"
"format-icons" = { "notification" = "msg*", "none" = "msg", "dnd-notification" = "dnd*", "dnd-none" = "dnd" }

[bar.modules.recorder]
rec = "[rec]"
paused = "[||]"
replay = "[rpl]"

[bar.modules.power]
format = "[x]"
