# Look retro — hyprlock: reloj con segundos en fósforo, prompt de terminal.
# Colores vía wallust; acento = color12.

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$font = JetBrainsMono Nerd Font

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $background

    blur_size = 2
    blur_passes = 1
    noise = 0.0
    contrast = 1.0
    brightness = 0.25
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = $color12
    font_size = 90
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%Y-%m-%d %a') — $USER@$(uname -n)"
    color = $color8
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = false
    outer_color = $color12
    inner_color = $background
    font_color = $color12
    check_color = $color12
    fail_color = rgb(e06c75)
    capslock_color = $color11
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##ffffff55">$ password_</span>
    fail_text = <span foreground="##e06c75">$FAIL</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# Layout de teclado, abajo y discreto
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
