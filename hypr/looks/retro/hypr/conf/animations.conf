# Look retro: nada se desliza — las ventanas solo aparecen/desaparecen rápido
animations {
  enabled = yes

  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 1.5, liner, popin 100%
  animation = windowsOut, 1, 1, liner, popin 100%
  animation = windowsMove, 1, 1, liner
  animation = border, 0
  animation = borderangle, 0
  animation = fade, 1, 2, liner
  animation = fadeDim, 1, 3, liner
  animation = layers, 1, 1, liner, fade
  animation = workspaces, 1, 1, liner, fade
  animation = specialWorkspace, 1, 1, liner, fade
}
