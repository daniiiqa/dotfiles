# Look ofrenda: lentas y tibias, como la llama de una vela — las ventanas se
# encienden desde 85% con un fade largo; el borde gira despacio.
animations {
  enabled = yes

  bezier = flame, 0.25, 0.1, 0.25, 1
  bezier = smoke, 0.4, 0, 0.6, 1

  animation = windows, 1, 6, flame, popin 85%
  animation = windowsOut, 1, 5, smoke, popin 85%
  animation = windowsMove, 1, 5, flame
  animation = border, 1, 10, smoke
  animation = borderangle, 1, 60, smoke, loop
  animation = fade, 1, 7, smoke
  animation = layers, 1, 5, flame, fade
  animation = workspaces, 1, 6, flame, fade
  animation = specialWorkspace, 1, 5, flame, slidevert
}
