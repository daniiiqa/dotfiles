# Look ofrenda — hyprlock: el altar de noche: fondo oscurecido y tibio, flores de cempasúchil arriba,
# hora grande en luz de vela, la fecha a mano.
# Paleta fija.

$font = MonaspiceRn Nerd Font

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgba(18, 12, 22, 1)

    blur_size = 4
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.38
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = ✿ ✿ ✿
    color = rgba(224, 33, 138, 1)
    font_size = 20
    font_family = $font
    position = 50, -40
    halign = left
    valign = top
    zindex = 1
}

label {
    monitor =
    text = ofrenda
    color = rgba(255, 140, 26, 1)
    font_size = 16
    font_family = $font
    position = -50, -44
    halign = right
    valign = top
    zindex = 1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 140, 26, 1)
    font_size = 120
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
    zindex = 1
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(255, 140, 26, 0.5)
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d de %B')"
    color = rgba(241, 228, 214, 1)
    font_size = 18
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 16
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(255, 140, 26, 1)
    inner_color = rgba(28, 19, 34, 0.92)
    font_color = rgba(241, 228, 214, 1)
    check_color = rgba(224, 33, 138, 1)
    fail_color = rgba(229, 56, 59, 1)
    capslock_color = rgba(224, 33, 138, 1)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##9a87a6">tu nombre para la ofrenda</span>
    fail_text = <span foreground="##e5383b">no te reconocen</span>
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
    zindex = 1
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = rgba(241, 228, 214, 0.45)
    font_size = 12
    font_family = $font
    position = 50, 40
    halign = left
    valign = bottom
}
