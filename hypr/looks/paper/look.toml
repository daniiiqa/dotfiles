# discada — look «paper»
# Lo único que hay que tocar para cambiar sus colores, fuente o estilo:
# los archivos de cada app (waybar/, rofi/, hypr/…) usan estos nombres.
# LookBuild.py lo aplica (lo llama LookSwitch.sh).

[about]
es = "papel y tinta, toques de serif"
en = "paper and ink, serif touches"

[font]
family = "BlexMono Nerd Font"   # {{font}} en los archivos del look
display = "Noto Serif"   # {{font_display}}: títulos
package = "ttf-ibmplex-mono-nerd"   # lo instala install.sh

[colors]
from = "wallpaper"   # wallust los saca del wallpaper (color0…color15)

[colors.named]
# nombres propios del look (@acc en css y rofi, $acc en hyprland…);
# el valor es un color o el nombre de otro (color12, background…)
critical = "#e06c75"
rec = "#c0392b"

[style]
# cómo se ven rola, vato, taco, arre y nvim (ver el README de vato)
borders = "plain"
bar = "line"
labels = "words"
case = "normal"
select = "bar"
tint = "ink"
transparent = false

[wallust]
palette = "light16"
