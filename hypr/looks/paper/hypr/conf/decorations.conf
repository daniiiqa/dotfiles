# Look paper: e-ink — fondo claro, tinta oscura, líneas finas, cero sombras
# y cero blur. Colores de wallust (paleta light16).

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  gaps_in = 3
  gaps_out = 8

  col.active_border = $foreground
  col.inactive_border = $color8
}

decoration {
  rounding = 3

  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_special = 0.2

  shadow {
    enabled = false
  }

  blur {
    enabled = false
  }
}

group {
  col.border_active = $foreground
  col.border_inactive = $color8

  groupbar {
    col.active = $foreground
    col.inactive = $color8
  }
}
