# Look paper: como pasar una página — fundidos cortos, nada rebota
animations {
  enabled = yes

  bezier = page, 0.4, 0, 0.2, 1

  animation = windows, 1, 3, page, popin 98%
  animation = windowsOut, 1, 2, page, popin 98%
  animation = windowsMove, 1, 3, page
  animation = border, 1, 3, page
  animation = borderangle, 0
  animation = fade, 1, 3, page
  animation = layers, 1, 2, page, fade
  animation = workspaces, 1, 3, page, fade
  animation = specialWorkspace, 1, 3, page, fade
}
