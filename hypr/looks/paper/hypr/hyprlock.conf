# Look paper — hyprlock: hoja lisa, reloj en serif, línea de tinta para la contraseña.
# Colores vía wallust; acento = color12.

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$font = BlexMono Nerd Font
$serif = Noto Serif Display

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    # papel liso: sin wallpaper, solo el fondo de la paleta clara
    color = $background
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 120
    font_family = $serif Italic
    position = 0, 120
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = $color8
    font_size = 18
    font_family = $serif
    position = 0, 20
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 3
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true
    outer_color = $foreground
    inner_color = $background
    font_color = $foreground
    check_color = $color8
    fail_color = rgb(e06c75)
    capslock_color = $color11
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i>$USER</i>
    fail_text = <span foreground="##e06c75">$FAIL</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# Layout de teclado, abajo y discreto
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
