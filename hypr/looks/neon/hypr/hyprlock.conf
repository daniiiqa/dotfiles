# Look neon — hyprlock: reloj con halo, input con borde degradado de tres tonos.
# Colores vía wallust; acento = color12.

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$font = {{font}}

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $background

    blur_size = 6
    blur_passes = 3
    noise = 0.0
    contrast = 1.0
    brightness = 0.4
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $color14
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $color12
    shadow_boost = 1.4
    position = 0, 120
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.55)
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    rounding = 4
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true
    outer_color = $color12 $color13 $color14 45deg
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = $foreground
    check_color = $color14
    fail_color = $critical
    capslock_color = $color11
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##ffffff66">$USER</span>
    fail_text = <span foreground="##e06c75">$FAIL</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# Layout de teclado, abajo y discreto
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
