# Look neon: rápidas con un pequeño rebote; el degradado del borde gira solo
animations {
  enabled = yes

  bezier = zap, 0.1, 1, 0.2, 1.05
  bezier = out, 0.3, 0, 0.2, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 3, zap, slide
  animation = windowsIn, 1, 3, zap, slide
  animation = windowsOut, 1, 2, out, slide
  animation = windowsMove, 1, 3, zap
  animation = border, 1, 4, out
  animation = borderangle, 0
  animation = fade, 1, 3, out
  animation = layers, 1, 3, zap, slide
  animation = workspaces, 1, 3, zap, slide
  animation = specialWorkspace, 1, 3, zap, slidevert
}
