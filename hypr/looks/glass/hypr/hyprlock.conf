# Look glass — hyprlock: fondo muy desenfocado, input de vidrio con borde helado.
# Colores vía wallust; acento = color12.

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$font = GeistMono Nerd Font

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $background

    blur_size = 10
    blur_passes = 4
    noise = 0.0
    contrast = 1.0
    brightness = 0.75
    vibrancy = 0.3
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 110
    font_family = $font Light
    position = 0, 120
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.55)
    font_size = 16
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = 14
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $foreground
    check_color = $color12
    fail_color = rgb(e06c75)
    capslock_color = $color11
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##ffffff66">$USER</span>
    fail_text = <span foreground="##e06c75">$FAIL</span>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# Layout de teclado, abajo y discreto
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
