# Look glass: animaciones con resorte — overshoot ligero al entrar
animations {
  enabled = yes

  bezier = spring, 0.05, 0.9, 0.1, 1.08
  bezier = out, 0.3, 0, 0.2, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 5, spring, popin 85%
  animation = windowsIn, 1, 5, spring, popin 85%
  animation = windowsOut, 1, 3, out, popin 85%
  animation = windowsMove, 1, 5, spring
  animation = border, 1, 6, out
  animation = borderangle, 1, 40, liner, loop   # el canto de luz gira
  animation = fade, 1, 4, out
  animation = layers, 1, 4, spring, popin 90%
  animation = workspaces, 1, 5, spring, slide
  animation = specialWorkspace, 1, 5, spring, slidevert
}
