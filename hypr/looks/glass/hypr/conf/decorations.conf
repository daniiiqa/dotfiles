# Look glass: vidrio esmerilado — ventanas translúcidas con blur fuerte,
# canto de luz que gira alrededor del borde, dock de píldoras abajo. Colores de wallust (paleta dark16).

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 8
  gaps_out = 18

  col.active_border = rgba(ffffff88) rgba(ffffff10) $color12 rgba(ffffff10) 45deg
  col.inactive_border = rgba(ffffff14)
}

decoration {
  rounding = 20
  rounding_power = 2.8

  active_opacity = 0.86
  inactive_opacity = 0.72
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_special = 0.3

  shadow {
    enabled = true
    range = 40
    render_power = 2
    offset = 0 12
    color = rgba(00000066)
    color_inactive = rgba(00000033)
  }

  blur {
    enabled = true
    size = 12
    passes = 4
    noise = 0.02
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.3
    vibrancy_darkness = 0.2
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = rgba(ffffff88) rgba(ffffff10) $color12 rgba(ffffff10) 45deg
  col.border_inactive = rgba(ffffff1a)

  groupbar {
    col.active = $color12
    col.inactive = $color0
  }
}

# Esmerilado de capas — viven aquí (y no en windowrules.conf) porque son
# parte del look: al cambiar de look, hyprctl reload las quita.
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.1
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.1
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.1
layerrule = match:namespace logout_dialog, blur on
