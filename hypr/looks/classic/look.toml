# discada — look «classic»
# Lo único que hay que tocar para cambiar sus colores, fuente o estilo:
# los archivos de cada app (waybar/, rofi/, hypr/…) usan estos nombres.
# LookBuild.py lo aplica (lo llama LookSwitch.sh).

[about]
es = "el original: iconos, blur, JetBrainsMono"
en = "the original: icons, blur, JetBrainsMono"

[font]
family = "JetBrainsMono Nerd Font"   # {{font}} en los archivos del look
package = ""   # lo instala install.sh (va siempre)

[colors]
from = "wallpaper"   # wallust los saca del wallpaper (color0…color15)

[colors.named]
# nombres propios del look (@acc en css y rofi, $acc en hyprland…);
# el valor es un color o el nombre de otro (color12, background…)
critical = "#ff0000"
warning = "#f3f809"

[style]
# cómo se ven rola, vato, taco, arre y nvim (ver el README de vato)
borders = "auto"
bar = "line"
labels = "icons"
case = "normal"
select = "fill"
tint = "color"
transparent = true

[wallust]
palette = "dark16"

[bar]
# empalme, la barra de discada (LookBar.py: traducido de waybar/)
position = "top"
height = 30
margin = [3, 8, 0, 8]     # arriba, derecha, abajo, izquierda (pixeles)
style = "solid"
radius = 0
font-size = 13     # pixeles, como en el style.css de waybar
pad = 0                # el relleno de cada módulo va en su padding (pixeles)
gap = 0                # celdas entre módulos
spacing = 6            # pixeles entre módulos (el spacing de waybar)
left = ["text#menu", "text#blank_2", "workspaces", "text#blank_2", "visualizer", "group/notify", "app#i1", "app#i2", "app#i3", "app#i4", "app#i5", "app#i6", "app#i7", "app#i8", "group/apps"]
center = ["clock", "idle"]
right = ["recorder", "group/mobo_drawer", "text#blank_2", "group/audio", "text#blank_2", "network", "bluetooth", "battery", "text#blank_2", "power"]

[bar.box]
bg = "transparent"
radius = 1

[bar.pill]
"text-shadow" = "0px 0px 2px alpha(black, 0.9), 0px 1px 3px alpha(black, 0.7)"

[bar.modules.workspaces]
format = "{icon}"
"format-icons" = { "active" = "<span font='12'>󰮯</span>", "empty" = "<span font='8'></span>", "default" = "󰊠" }
persistent = 5
padding = 6
fg = "color13"
"active-fg" = "color12"
"button-padding" = 8
"active-padding" = 12
"button-radius" = 9
"text-shadow" = "none"
"empty-fg" = "color13"

[bar.modules.clock]
format = " {:%H:%M:%S}"
"format-alt" = " {:L%H:%M   %Y, %d %B, %A}"
"tooltip-format" = "<tt><small>{calendar}</small></tt>"
calendar = { "format" = { "months" = "<span color='#ffead3'><b>{}</b></span>", "days" = "<span color='#ecc6d9'><b>{}</b></span>", "weeks" = "<span color='#99ffdd'><b>W{:%V}</b></span>", "weekdays" = "<span color='#ffcc66'><b>{}</b></span>", "today" = "<span color='#ff6699'><b><u>{}</u></b></span>" } }
padding = 6
fg = "color12"

[bar.modules.temperature]
tooltip = true
"format-critical" = "{temperatureC}°C {icon}"
format = "{temperatureC}°C {icon}"
"format-icons" = ["󰈸"]
interval = 10
"critical-threshold" = 82
padding = 6
fg = "color12"

[bar.modules.cpu]
format = "{usage}% 󰍛"
"format-alt" = "{icon0}{icon1}{icon2}{icon3} {usage:>2}% 󰍛"
"format-icons" = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
interval = 1
padding = 6
fg = "color12"

[bar.modules.memory]
format = "{used:0.1f}G 󰾆"
"format-alt" = "{percentage}% 󰾆"
tooltip = true
"tooltip-format" = "{used:0.1f}GB/{total:0.1f}G"
interval = 10
padding = 6
fg = "color12"

[bar.modules.disk]
format = "{percentage_used}% 󰋊"
"tooltip-format" = "{used} used out of {total} on {path} ({percentage_used}%)"
interval = 30
path = "/"
padding = 6
fg = "color12"

[bar.modules.audio]
format = "{icon} {volume}%"
"format-muted" = "󰖁"
"format-bluetooth" = "{icon} 󰂰 {volume}%"
"tooltip-format" = "{icon} {desc} | {volume}%"
"format-icons" = { "headphone" = "", "hands-free" = "", "headset" = "", "phone" = "", "portable" = "", "car" = "", "default" = ["", "", "󰕾", ""] }
padding = 6
fg = "color12"

[bar.modules.mic]
format = " {volume}%"
"format-muted" = ""
"tooltip-format" = "{source_desc} | {source_volume}%"
padding = 6
fg = "color12"

[bar.modules.network]
format = "{ifname}"
"format-wifi" = "{icon}"
"format-ethernet" = "󰌘"
"format-disconnected" = "󰌙"
"tooltip-format" = "{ipaddr}  {bandwidthUpBits}  {bandwidthDownBits}"
"format-linked" = "󰈁 {ifname} (No IP)"
"tooltip-format-wifi" = "{essid} {icon} {signalStrength}%"
"tooltip-format-ethernet" = "{ifname} 󰌘"
"tooltip-format-disconnected" = "󰌙 Disconnected"
"format-icons" = ["󰤯", "󰤟", "󰤢", "󰤥", "󰤨"]
padding = 6
"font-size" = 20
fg = "color12"

[bar.modules.bluetooth]
format = ""
"format-disabled" = "󰂳"
"format-connected" = "󰂱 {num_connections}"
"tooltip-format" = " {device_alias}"
"tooltip-format-connected" = "{device_enumerate}"
"tooltip-format-enumerate-connected" = " {device_alias} 󰂄{device_battery_percentage}%"
tooltip = true
padding = 6
"font-size" = 20
fg = "color12"

[bar.modules.idle]
tooltip = true
"tooltip-format-activated" = "Stay awake: on\nScreen won't dim, lock or sleep"
"tooltip-format-deactivated" = "Stay awake: off\nClick to keep the screen on"
format = "{icon}"
"format-icons" = { "activated" = "", "deactivated" = "" }
padding = 6
"font-size" = 20
fg = "color12"

[bar.modules.notifications]
format = "{} {icon}"
"format-icons" = { "notification" = "<span foreground='red'><sup></sup></span>", "none" = "", "dnd-notification" = "<span foreground='red'><sup></sup></span>", "dnd-none" = "" }
padding = 6
fg = "color12"

[bar.modules.recorder]
rec = ""
paused = ""
replay = ""
fg = "color12"
padding = 6

[bar.modules.power]
format = "⏻"
tooltip = true
"tooltip-format" = "Left Click: Logout Menu\nRight Click: Change Blur"
padding = 6
"font-size" = 20
fg = "color12"

[bar.modules.battery]
format = "{icon} {percentage}%"
"format-icons" = { "discharging" = ["󰁺", "󰁻", "󰁼", "󰁽", "󰁾", "󰁿", "󰂀", "󰂁", "󰂂", "󰁹"], "charging" = ["󰢜", "󰂆", "󰂇", "󰂈", "󰢝", "󰂉", "󰢞", "󰂊", "󰂋", "󰂅"], "full" = ["󰚥"], "saver" = ["󰌪"] }
"low-color" = "critical"
"critical-color" = "critical"
padding = 6
"font-size" = 20
fg = "color12"

[bar.modules."text#menu"]
format = "  "
"on-click" = "pkill rofi || rofi -show drun -modi run,drun,filebrowser,window"
"on-click-middle" = "$HOME/.config/hypr/scripts/WallpaperSelect.sh"
tooltip = true
"tooltip-format" = "Left Click: Rofi Menu\nMiddle Click: Wallpaper Menu"
padding = 6
fg = "color12"

[bar.modules."text#blank_2"]
format = "  "
tooltip = false
fg = "color12"

[bar.modules.visualizer]
style = "braille"
bars = 16
padding = 6
"font-size" = 14
color = "color12"

[bar.modules.app]
padding = 4
"font-size" = 20
color = "color12"
"active-line" = "bottom"
"active-color" = "color12"

[bar.modules."app#more"]
fg = "color12"
padding = 4
"font-size" = 20

[bar.hover-workspaces]
fg = "color12"

[bar.tooltip]
bg = "color10"
radius = 10

[bar.groups.notify]
modules = ["notifications"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = false }

[bar.groups.apps]
modules = ["app#more", "app#d1", "app#d2", "app#d3", "app#d4", "app#d5", "app#d6", "app#d7", "app#d8"]
drawer = { "transition-duration" = 250, "transition-left-to-right" = true }

[bar.groups.mobo_drawer]
modules = ["temperature", "cpu", "memory", "disk"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = true }

[bar.groups.audio]
modules = ["audio", "mic"]
drawer = { "transition-duration" = 500, "transition-left-to-right" = true }
