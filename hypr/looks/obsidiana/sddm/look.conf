FontSize="13"
RoundCorners="22"
FormPosition="center"
HaveFormBackground="true"
PartialBlur="false"
FullBlur="false"
BlurMax="48"
DimBackground="0.3"
HeaderText=""
HourFormat="HH:mm"
DateFormat="dddd d MMMM"
BackgroundColor="@bg0"
DimBackgroundColor="@bg0"
FormBackgroundColor="@bg0"
LoginFieldBackgroundColor="@bg1"
PasswordFieldBackgroundColor="@bg1"
LoginFieldTextColor="@fg"
PasswordFieldTextColor="@fg"
UserIconColor="@dim"
PasswordIconColor="@dim"
HoverUserIconColor="@brillo"
HoverPasswordIconColor="@brillo"
PlaceholderTextColor="@dim"
HeaderTextColor="@dim"
DateTextColor="@brillo"
TimeTextColor="@hi"
LoginButtonTextColor="@bg0"
LoginButtonBackgroundColor="@acc"
SystemButtonsIconsColor="@dim"
SessionButtonTextColor="@dim"
VirtualKeyboardButtonTextColor="@dim"
HoverSystemButtonsIconsColor="@fg"
HoverSessionButtonTextColor="@fg"
HoverVirtualKeyboardButtonTextColor="@fg"
DropdownTextColor="@fg"
DropdownBackgroundColor="@bg1"
DropdownSelectedBackgroundColor="@bg1"
HighlightTextColor="@bg0"
HighlightBackgroundColor="@acc"
HighlightBorderColor="@brillo"
