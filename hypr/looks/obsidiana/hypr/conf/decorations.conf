# Look obsidiana: vidrio volcánico — ventanas sin borde y transparentes, sin
# difuminado (el wallpaper se ve tal cual detrás del texto); la activa flota con
# una sombra corta, las demás se oscurecen como piedra a la sombra.
# Shader: un poco menos de color y un frío leve (GameMode.sh lo apaga).
# Paleta fija sobre tu wallpaper.


source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 0
  gaps_in = 8
  gaps_out = 20

  col.active_border = $brillo
  col.inactive_border = $line
}

decoration {
  rounding = 18
  rounding_power = 3

  active_opacity = 1.0
  inactive_opacity = 0.96
  fullscreen_opacity = 1.0

  # sin borde, lo activo se nota porque lo demás se apaga
  dim_inactive = true
  dim_strength = 0.28
  dim_special = 0.6

  # piedra: menos color, un frío leve. GameMode.sh lo apaga.
  screen_shader = ~/.config/hypr/shaders/obsidiana.frag

  shadow {
    enabled = true
    range = 18
    render_power = 3
    offset = 0 5
    sharp = false
    color = $bg0_a99
    color_inactive = $bg0_a00
  }

  # sin difuminado: lo de atrás se ve tal cual
  blur {
    enabled = false
    size = 12
    passes = 3
    noise = 0.01
    brightness = 0.7
    vibrancy = 0.0
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $brillo
  col.border_inactive = $line

  groupbar {
    col.active = $brillo
    col.inactive = $line
  }
}

layerrule = match:namespace swaync-control-center, ignore_alpha 0.2
