# Look obsidiana: pesadas y calmadas, como piedra — las ventanas se abren
# como lámina (gnomed), los workspaces suben y bajan (la barra está abajo),
# los menús salen desde abajo.
animations {
  enabled = yes

  bezier = piedra, 0.2, 0.9, 0.1, 1
  bezier = pulido, 0.5, 0, 0.5, 1

  animation = windows, 1, 6, piedra, gnomed
  animation = windowsOut, 1, 5, pulido, gnomed
  animation = windowsMove, 1, 6, piedra
  animation = border, 1, 10, pulido
  animation = fade, 1, 7, pulido
  animation = layers, 1, 5, piedra, slide bottom
  animation = workspaces, 1, 7, piedra, slidevert
  animation = specialWorkspace, 1, 6, piedra, slidefadevert 20%
}
