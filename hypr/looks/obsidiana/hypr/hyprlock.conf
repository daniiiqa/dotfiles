# Look obsidiana — hyprlock: tu wallpaper sin blur (si es video, su cuadro
# fijo); la hora apilada
# abajo a la izquierda (horas sobre minutos) en serif grande, la fecha en
# minúsculas al lado, la contraseña como una línea fina abajo a la derecha.
# Paleta fija.

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$font = {{font}}
$display = {{font_display}}

general {
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $bg0

    # sin blur: el wallpaper tal cual, un poco más oscuro para leer la hora
    blur_passes = 0
    contrast = 0.95
    brightness = 0.62
    vibrancy = 0.05
    vibrancy_darkness = 0.0

    # wallpaper en video: aquí va su cuadro fijo (.wallpaper_current). hyprlock
    # 0.9.6 no hace el crossfade al recargar (salta de golpe), así que una
    # "pintura viva" se ve a brincos; mejor quieto.
}

# horas
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)"
    color = $hi
    font_size = 150
    font_family = $display
    position = 80, 250
    halign = left
    valign = bottom
    zindex = 1
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $bg0_acc
}

# minutos, debajo y en gris de piedra
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%M)"
    color = $dim
    font_size = 150
    font_family = $display
    position = 80, 50
    halign = left
    valign = bottom
    zindex = 1
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $bg0_acc
}

# fecha, al lado de los minutos
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d de %B' | tr '[:upper:]' '[:lower:]')"
    color = $brillo
    font_size = 14
    font_family = $font
    position = 420, 90
    halign = left
    valign = bottom
    zindex = 1
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $bg0_acc
}

input-field {
    monitor =
    size = 280, 40
    outline_thickness = 1
    rounding = 0
    dots_size = 0.14
    dots_spacing = 0.6
    dots_center = false
    outer_color = $bg0_a00
    inner_color = $bg0_a00
    font_color = $hi
    check_color = $brillo
    fail_color = $critical
    capslock_color = $brillo
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##6f6d6a">contraseña ─────────</span>
    fail_text = <span foreground="##c46a6a">no ─────────</span>
    hide_input = false
    position = -80, 80
    halign = right
    valign = bottom
    zindex = 1
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = $dim
    font_size = 11
    font_family = $font
    position = -80, 50
    halign = right
    valign = bottom
}
