# Look nord: paleta Nord fija (no sigue al wallpaper) — tonos fríos y calmos,
# esquinas medias, escarcha ligera. https://www.nordtheme.com/docs/colors-and-palettes


source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 6

  col.active_border = $nord8 $nord9 90deg
  col.inactive_border = $nord1
}

decoration {
  rounding = 8
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.95
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_special = 0.4

  shadow {
    enabled = true
    range = 14
    render_power = 3
    offset = 0 4
    color = rgba(1a1e2699)
    color_inactive = rgba(1a1e2655)
  }

  blur {
    enabled = true
    size = 6
    passes = 2
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $nord8
  col.border_inactive = $nord1

  groupbar {
    col.active = $nord8
    col.inactive = $nord3
  }
}
