# Look pastel: animaciones suaves — fades y deslizamientos lentos, sin rebote
animations {
  enabled = yes

  bezier = soft, 0.25, 1, 0.5, 1
  bezier = gentle, 0.4, 0, 0.2, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 5, soft, popin 90%
  animation = windowsIn, 1, 5, soft, popin 90%
  animation = windowsOut, 1, 4, gentle, popin 90%
  animation = windowsMove, 1, 5, soft
  animation = border, 1, 8, gentle
  animation = borderangle, 1, 60, liner, loop
  animation = fade, 1, 5, gentle
  animation = layers, 1, 4, soft, fade
  animation = workspaces, 1, 5, soft, slidefade 15%
  animation = specialWorkspace, 1, 5, soft, slidefadevert 15%
}
