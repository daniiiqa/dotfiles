# Look loteria — hyprlock: la carta grande: la hora es el título de la carta, número de carta
# arriba a la izquierda, "¡LOTERÍA!" en rojo.
# Paleta fija.

$font = CodeNewRoman Nerd Font

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgba(239, 227, 196, 1)

    blur_size = 4
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# la carta
shape {
    monitor =
    size = 520, 560
    color = rgba(239, 227, 196, 0.94)
    rounding = 6
    border_size = 4
    border_color = rgba(26, 22, 18, 1)
    position = 0, 40
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = Nº 25
    color = rgba(200, 16, 46, 1)
    font_size = 20
    font_family = $font
    position = 0, 230
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = ¡LOTERÍA!
    color = rgba(200, 16, 46, 1)
    font_size = 28
    font_family = Noto Serif Black
    position = 0, -150
    halign = center
    valign = center
    zindex = 1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(26, 22, 18, 1)
    font_size = 120
    font_family = Noto Serif Black
    position = 0, 110
    halign = center
    valign = center
    zindex = 1
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d de %B')"
    color = rgba(107, 93, 72, 1)
    font_size = 18
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 3
    rounding = 6
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(26, 22, 18, 1)
    inner_color = rgba(229, 214, 176, 0.92)
    font_color = rgba(26, 22, 18, 1)
    check_color = rgba(29, 78, 158, 1)
    fail_color = rgba(200, 16, 46, 1)
    capslock_color = rgba(29, 78, 158, 1)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##6b5d48">¿cuál es tu carta?</span>
    fail_text = <span foreground="##c8102e">¡esa no es!</span>
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
    zindex = 1
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = rgba(26, 22, 18, 0.45)
    font_size = 12
    font_family = $font
    position = 50, 40
    halign = left
    valign = bottom
}
