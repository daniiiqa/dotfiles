# Look loteria: cartas: contorno negro grueso y sombra dura desplazada, como una
# carta impresa sobre la mesa. Sin blur.
# Paleta fija (no sigue al wallpaper).


source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 3
  gaps_in = 6
  gaps_out = 14

  col.active_border = $ink
  col.inactive_border = $bg3_a66
}

decoration {
  rounding = 6
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.97
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.06
  dim_special = 0.5

  shadow {
    enabled = true
    range = 1
    render_power = 1
    offset = 6 6
    sharp = true
    color = $bg3
    color_inactive = $bg3_a66
  }

  blur {
    enabled = false
    size = 6
    passes = 2
    noise = 0.02
    brightness = 1.05
    vibrancy = 0.15
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $acc
  col.border_inactive = $line

  groupbar {
    col.active = $acc
    col.inactive = $line
  }
}

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.2
layerrule = match:namespace logout_dialog, blur on
