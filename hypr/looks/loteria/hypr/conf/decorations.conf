# Look loteria: cartas: contorno negro grueso y sombra dura desplazada, como una
# carta impresa sobre la mesa. Sin blur.
# Paleta fija (no sigue al wallpaper).

$bg = rgb(efe3c4)
$line = rgb(cdb88a)
$ink = rgb(1a1612)
$acc = rgb(c8102e)
$acc2 = rgb(1d4e9e)
$alt = rgb(f2b705)
$rust = rgb(b5562f)

general {
  border_size = 3
  gaps_in = 6
  gaps_out = 14

  col.active_border = $ink
  col.inactive_border = rgba(1a161266)
}

decoration {
  rounding = 6
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.97
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.06
  dim_special = 0.5

  shadow {
    enabled = true
    range = 1
    render_power = 1
    offset = 6 6
    sharp = true
    color = rgba(1a1612ff)
    color_inactive = rgba(1a161266)
  }

  blur {
    enabled = false
    size = 6
    passes = 2
    noise = 0.02
    brightness = 1.05
    vibrancy = 0.15
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $acc
  col.border_inactive = $line

  groupbar {
    col.active = $acc
    col.inactive = $line
  }
}

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.2
layerrule = match:namespace logout_dialog, blur on
