# Look loteria: como repartir cartas — las ventanas entran deslizándose de
# lado con un rebote corto y se van rápido.
animations {
  enabled = yes

  bezier = deal, 0.34, 1.4, 0.64, 1
  bezier = snap, 0.6, 0, 0.9, 0.4

  animation = windows, 1, 4, deal, slide
  animation = windowsOut, 1, 3, snap, slide
  animation = windowsMove, 1, 4, deal
  animation = border, 1, 4, deal
  animation = borderangle, 0
  animation = fade, 1, 3, snap
  animation = layers, 1, 3, deal, slide top
  animation = workspaces, 1, 4, deal, slide
  animation = specialWorkspace, 1, 4, deal, slidevert
}
