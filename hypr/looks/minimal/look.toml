# discada — look «minimal»
# Lo único que hay que tocar para cambiar sus colores, fuente o estilo:
# los archivos de cada app (waybar/, rofi/, hypr/…) usan estos nombres.
# LookBuild.py lo aplica (lo llama LookSwitch.sh).

[about]
es = "limpio y discreto, iconos finos"
en = "clean and quiet, thin icons"

[font]
family = "GeistMono Nerd Font"   # {{font}} en los archivos del look
package = "otf-geist-mono-nerd"   # lo instala install.sh

[colors]
from = "wallpaper"   # wallust los saca del wallpaper (color0…color15)

[colors.named]
# nombres propios del look (@acc en css y rofi, $acc en hyprland…);
# el valor es un color o el nombre de otro (color12, background…)
critical = "#e06c75"

[style]
# cómo se ven rola, vato, taco, arre y nvim (ver el README de vato)
transparent = true
borders = "auto"
bar = "line"
labels = "short"
case = "normal"
select = "bar"
tint = "color"

[wallust]
palette = "dark16"

[bar]
# empalme, la barra de discada (traducido de waybar/config)
position = "top"
height = 31
margin = [8, 8, 0, 8]     # arriba, derecha, abajo, izquierda (pixeles)
style = "solid"
radius = 6
font-size = 13     # pixeles, como en el style.css de waybar
pad = 1                # celdas a cada lado de un módulo
gap = 0                # celdas entre módulos
left = ["workspaces"]
center = ["clock"]
right = ["recorder", "temperature", "cpu", "memory", "disk", "audio", "mic", "network", "bluetooth", "battery", "idle", "notifications", "power"]

[bar.modules.clock]
format = "{:%H:%M}"
"format-alt" = "{:L%a %d %b  %H:%M}"

[bar.modules.temperature]
"format-critical" = "{temperatureC}°C {icon}"
format = "{temperatureC}°C {icon}"
"format-icons" = [""]
interval = 10
"critical-threshold" = 82

[bar.modules.cpu]
format = "{usage}% "
"format-alt" = "{icon0}{icon1}{icon2}{icon3} {usage:>2}% "
"format-icons" = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
interval = 1

[bar.modules.memory]
format = "{used:0.1f}G "
"format-alt" = "{percentage}% "
interval = 10

[bar.modules.disk]
format = "{percentage_used}% "
interval = 30
path = "/"

[bar.modules.audio]
format = "{icon} {volume}%"
"format-muted" = ""
"format-bluetooth" = "{icon} 󰂰 {volume}%"
"format-icons" = { "headphone" = "", "hands-free" = "", "headset" = "", "phone" = "", "portable" = "", "car" = "", "default" = ["", "", "", ""] }

[bar.modules.mic]
format = " {volume}%"
"format-muted" = "󰍭"

[bar.modules.network]
format = "{ifname}"
"format-wifi" = "{icon}"
"format-ethernet" = ""
"format-disconnected" = ""
"format-linked" = " {ifname} (No IP)"
"format-icons" = ["󰤯", "󰤟", "󰤢", "󰤥", "󰤨"]

[bar.modules.bluetooth]
format = ""
"format-disabled" = "󰂳"
"format-connected" = "󰂱 {num_connections}"

[bar.modules.idle]
format = "{icon}"
"format-icons" = { "activated" = "", "deactivated" = "" }

[bar.modules.notifications]
format = "{} {icon}"
"format-icons" = { "notification" = "<span foreground='red'><sup></sup></span>", "none" = "", "dnd-notification" = "<span foreground='red'><sup></sup></span>", "dnd-none" = "" }

[bar.modules.recorder]
rec = ""
paused = ""
replay = ""

[bar.modules.power]
format = ""
