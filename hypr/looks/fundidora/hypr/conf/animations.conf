# Look fundidora: mecánicas, como una grúa de la acería — arrancan con fuerza,
# frenan en seco; las ventanas caen desde arriba.
animations {
  enabled = yes

  bezier = crane, 0.2, 0.9, 0.25, 1
  bezier = press, 0.7, 0, 0.84, 0

  animation = windows, 1, 3, crane, slide top
  animation = windowsOut, 1, 2, press, popin 90%
  animation = windowsMove, 1, 3, crane
  animation = border, 1, 4, crane
  animation = borderangle, 0
  animation = fade, 1, 3, crane
  animation = layers, 1, 3, crane, slide top
  animation = workspaces, 1, 3, crane, slidevert
  animation = specialWorkspace, 1, 3, crane, slidevert
}
