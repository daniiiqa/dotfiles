# Look fundidora: lámina de acero con bordes de óxido y cobre. Sin blur: plano y pesado.
# Paleta fija (no sigue al wallpaper).

$bg = rgb(0a0605)
$line = rgb(282119)
$ink = rgb(4a3d31)
$acc = rgb(8f7156)
$acc2 = rgb(a8805a)
$alt = rgb(867261)
$rust = rgb(b5562f)

general {
  border_size = 2
  gaps_in = 4
  gaps_out = 10

  col.active_border = $acc2 $acc $rust 90deg
  col.inactive_border = $line
}

decoration {
  rounding = 2
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.94
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.06
  dim_special = 0.5

  shadow {
    enabled = true
    range = 18
    render_power = 3
    offset = 0 10
    sharp = false
    color = rgba(000000aa)
    color_inactive = rgba(00000022)
  }

  blur {
    enabled = false
    size = 6
    passes = 2
    noise = 0.02
    brightness = 0.9
    vibrancy = 0.15
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $acc
  col.border_inactive = $line

  groupbar {
    col.active = $acc
    col.inactive = $line
  }
}

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.2
layerrule = match:namespace logout_dialog, blur on
