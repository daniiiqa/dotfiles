# Look fundidora — hyprlock: placa de la acería: hora enorme al rojo vivo, "PARQUE FUNDIDORA" estampado
# arriba, el cerro y la fecha abajo.
# Paleta fija.

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$font = {{font}}

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $bg0

    blur_size = 4
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.4
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = PARQUE FUNDIDORA · HORNO ALTO 3
    color = $acc2
    font_size = 20
    font_family = $font
    position = 50, -40
    halign = left
    valign = top
    zindex = 1
}

label {
    monitor =
    text = MONTERREY, N.L.
    color = $acc
    font_size = 16
    font_family = $font
    position = -50, -44
    halign = right
    valign = top
    zindex = 1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $acc
    font_size = 130
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
    zindex = 1
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $acc_a80
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%a %d %b %Y' | tr a-z A-Z)"
    color = $fg
    font_size = 18
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = 2
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    outer_color = $acc
    inner_color = $bg1_aeb
    font_color = $fg
    check_color = $acc2
    fail_color = $warn
    capslock_color = $acc2
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##6f6b66">CONTRASEÑA</span>
    fail_text = <span foreground="##a0583a">ACCESO DENEGADO</span>
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
    zindex = 1
}

# Layout de teclado
label {
    monitor =
    text = $LAYOUT
    color = $fg_a73
    font_size = 12
    font_family = $font
    position = 50, 40
    halign = left
    valign = bottom
}
