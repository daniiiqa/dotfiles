# Hyprland — https://wiki.hyprland.org/
#
#   conf/defaults.conf      apps por defecto ($term, $files, $edit…)
#   conf/env.conf           variables de entorno
#   conf/startup.conf       exec-once
#   conf/settings.conf      input, layouts, misc
#   conf/decorations.conf   look (colores de wallust)
#   conf/animations.conf
#   conf/windowrules.conf
#   conf/keybinds.conf
#   monitors.conf / workspaces.conf   los escribe nwg-displays

$conf = $HOME/.config/hypr/conf

source = $conf/defaults.conf
source = $conf/env.conf
source = $conf/startup.conf
source = $conf/settings.conf
source = $conf/decorations.conf
source = $conf/animations.conf
source = $conf/windowrules.conf
source = $conf/keybinds.conf

source = $HOME/.config/hypr/monitors.conf
source = $HOME/.config/hypr/workspaces.conf
