# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


# ─── Godot ───────────────────────────────────────────────────────────────────
# La ventana del juego que lanza el editor (F5) NO toma la class "Godot": toma
# el nombre del proyecto. El editor es class Godot, el juego es class Catalyst.
# Sin esto Hyprland la azuleja y la parte contra el editor.
#
# Hyprland 0.55: las reglas booleanas exigen valor. "float" sola no parsea
# ("invalid field float: missing a value") — tiene que ser "float true".
windowrule = match:class ^(Catalyst)$, float true
windowrule = match:class ^(Catalyst)$, size 1600 900
windowrule = match:class ^(Catalyst)$, center true

