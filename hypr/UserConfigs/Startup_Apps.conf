# Commands and Apps to be executed at launch

### wallpaper daemons: independientes por monitor ###
# swww (imágenes/gifs) SIEMPRE activo; los videos van por monitor en
# LiveWallpaper.conf, que WallpaperSelect.sh regenera solo. No editar a mano.
exec-once = swww-daemon --format xrgb
source = $HOME/.config/hypr/UserConfigs/LiveWallpaper.conf

