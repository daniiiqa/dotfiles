# Commands and Apps to be executed at launch

### wallpaper daemon (imagen/gif = swww, video = mpvpaper) ###
# WallpaperSelect.sh comenta/descomenta estas líneas según el tipo de fondo.
$livewallpaper="$HOME/Pictures/wallpapers/hornet-and-the-knight.3840x2160.mp4"
#exec-once = swww-daemon --format xrgb
exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop hwdec=auto" $livewallpaper

