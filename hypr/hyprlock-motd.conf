# Custom (dany): el motd de discada también en el candado: la misma frase que
# el telón de la entrada (Motd.sh la deja en $XDG_RUNTIME_DIR/discada-motd y
# LockScreen.sh escoge otra en cada bloqueo). Lo carga al final el
# hyprlock.conf de cada look: toma su $font y sus colores de wallust.
label {
    monitor =
    text = cmd[update:30000] $HOME/.config/hypr/scripts/Motd.sh --leer
    color = $color12
    font_size = 13
    font_family = $font
    position = 0, 120
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
}
