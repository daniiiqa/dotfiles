# Grabador (hypr/scripts/Recorder.sh) — lo lee como bash al arrancar.

DIR="$HOME/Videos"
FPS=60
QUALITY=very_high                    # medium | high | very_high | ultra
CODEC=auto                           # auto | h264 | hevc | av1
CURSOR=yes
RECORD_DND=yes                       # no molestar de swaync mientras graba
# pistas de audio: "a|b" las mezcla en una sola pista. default_output es el
# sonido del sistema, default_input el micrófono; "" graba sin audio
AUDIO="default_output|default_input"

# replay (los últimos N segundos, en RAM; se guardan con ALT+F10)
REPLAY_SECONDS=60
REPLAY_AUDIO="default_output"
REPLAY_BITRATE=40000                 # kbps, constante
REPLAY_ON_STARTUP=yes                # arrancarlo al iniciar sesión
