# Lo que arranca con la sesión

$scriptsDir = $HOME/.config/hypr/scripts

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $scriptsDir/Polkit.sh

# Wallpapers independientes por monitor: awww (imágenes/gifs) SIEMPRE vivo;
# los videos van por monitor en livewallpaper.conf, que WallpaperSelect.sh
# regenera solo.
exec-once = awww-daemon --format xrgb
source = $HOME/.config/hypr/conf/livewallpaper.conf

# Barra, notificaciones, idle
exec-once = $scriptsDir/AppStrip.py daemon   # apps abiertas en waybar (antes que la barra)
exec-once = $scriptsDir/FitGuard.py   # apps que no caben en su tile (Discord) flotan
exec-once = $scriptsDir/Waybar.sh   # relanza waybar si crashea al inicio (mpris)
exec-once = $scriptsDir/FirstRun.sh   # solo la primera vez en una máquina nueva
exec-once = swaync
exec-once = hypridle
exec-once = $scriptsDir/FontSize.py apply   # tamaño de letra de discada (hypr/discada.conf)
exec-once = $scriptsDir/Recorder.sh autostart   # replay buffer (hypr/recorder.conf)

# Terminal dropdown (SUPER+Shift+Enter)
exec-once = $scriptsDir/Dropterminal.sh kitty

# Portapapeles
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
