# Reglas de ventanas — https://wiki.hyprland.org/Configuring/Window-Rules/
# Sintaxis Hyprland >= 0.53: match:..., y las booleanas llevan valor ("float on").
#
# Aquí NO va opacidad ni blur por app: eso es de cada look
# (looks/<nombre>/hypr/conf/decorations.conf). Si se pusiera aquí, paper,
# brutalist y retro dejarían de ser opacos y kitty quedaría doble-transparente.
# La excepción es el video, que siempre va sólido.
# Las layerrules (la barra, swaync, rofi, wlogout) también viven en cada look.

# la barra (empalme) aparece sin animación: al recargar (SUPER+Alt+R, cambio
# de look) vuelve al instante en vez de deslizarse
layerrule = match:namespace empalme, no_anim on

# rofi con blur detrás: los looks con menú translúcido (glass) lo necesitan,
# en los opacos no se nota
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.1

# ─── Tags ────────────────────────────────────────────────────────────────────
windowrule = match:class ^(zen|zen-browser)$, tag +browser
windowrule = match:class ^(kitty|kitty-dropterm)$, tag +terminal
windowrule = match:class ^(taco)$, tag +files
windowrule = match:class ^(discord|vesktop)$, tag +chat
windowrule = match:class ^([Ss]team|net.lutris.Lutris|org.prismlauncher.PrismLauncher|net.davidotek.pupgui2)$, tag +launcher
windowrule = match:class ^(steam_app_[0-9]+|gamescope)$, tag +game
windowrule = match:class ^(mpv|vlc)$, tag +video

# Herramientas chicas: flotan centradas a 70%
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, tag +tool
windowrule = match:class ^(\.?blueman-manager(-wrapped)?|nm-connection-editor)$, tag +tool
windowrule = match:class ^(nwg-displays|nwg-look|qt5ct|qt6ct|kvantummanager)$, tag +tool
windowrule = match:class ^(org.gnome.baobab|org.gnome.SystemMonitor|gnome-system-monitor)$, tag +tool
windowrule = match:class ^(xarchiver|org.gnome.Loupe)$, tag +tool
windowrule = match:class ^(xdg-desktop-portal-gtk)$, tag +tool

# ─── Herramientas y diálogos ─────────────────────────────────────────────────
# vato (Vato.sh): audio, bluetooth, red y sistema en la terminal
windowrule = match:class ^(vato|discada-update)$, float on, center on, size (monitor_w*0.55) (monitor_h*0.6)
windowrule = match:tag tool, float on, center on, size (monitor_w*0.7) (monitor_h*0.7)
windowrule = match:class ^(qalculate-gtk)$, float on, center on
windowrule = match:class ^(org.xfce.mousepad)$, float on, center on, size (monitor_w*0.5) (monitor_h*0.6)

# Cheat sheet (SUPER+H, yad "Atajos") y demás ventanitas de yad
windowrule = match:title ^(Atajos)$, float on, center on, size (monitor_w*0.65) (monitor_h*0.9)
windowrule = match:class ^(yad)$ match:title negative:^(Atajos)$, float on, center on, size (monitor_w*0.2) (monitor_h*0.2)

# Polkit / llaveros: siempre al frente y al centro
windowrule = match:class ^(hyprpolkitagent|org.kde.polkit-kde-authentication-agent-1|gcr-prompter)$, float on, center on, pin on

# Abrir/guardar archivos
windowrule = match:title ^(Save As|Save File|Open File|Open Files|Open Folder)$, float on, center on, size (monitor_w*0.6) (monitor_h*0.6)

# SDDM Background (SDDMWallpaperSync)
windowrule = match:title ^(SDDM Background)$, float on, center on, size (monitor_w*0.16) (monitor_h*0.12)

# Steam: la principal azulejada; amigos, ajustes, etc. flotan
windowrule = match:class ^([Ss]team)$ match:title negative:^([Ss]team)$, float on

windowrule = match:class ^(hyprland-donate-screen)$, float on, center on

# ─── Video y juegos ──────────────────────────────────────────────────────────
windowrule = match:tag video, opacity 1.0 override 1.0 override, no_blur on
windowrule = match:class ^(mpv)$, float on, center on, size (monitor_w*0.6) (monitor_h*0.6)
windowrule = match:tag game, opacity 1.0 override 1.0 override, no_blur on, no_shadow on

# Picture-in-Picture de Zen: esquina superior derecha, siempre visible
windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    keep_aspect_ratio = on
    size = (monitor_w*0.3) (monitor_h*0.3)
    move = 69% 7%
    opacity = 1.0 override 1.0 override
}

# Nada de bloquear/suspender mientras algo esté en pantalla completa
windowrule = match:fullscreen true, idle_inhibit fullscreen

# ─── Godot ───────────────────────────────────────────────────────────────────
# La ventana del juego que lanza el editor (F5) NO toma la class "Godot": toma
# el nombre del proyecto. El editor es class Godot, el juego es class Catalyst.
# Sin esto Hyprland la azuleja y la parte contra el editor.
windowrule = match:class ^(Catalyst)$, float on, center on, size 1600 900
# Otro proyecto de Godot: copia la línea con su nombre de proyecto.
