# Apps por defecto. QuickSettings.sh, RofiSearch.sh y WaybarScripts.sh leen
# este archivo (formato `$var = valor`), así que mantener una var por línea.

env = EDITOR,nvim
$edit = ${EDITOR:-nano}
$term = kitty
$files = kitty --class yazi -e yazi   # explorador en terminal (también abre las carpetas desde apps)
$Search_Engine = "https://www.google.com/search?q={}"
