# Apps por defecto. QuickSettings.sh y RofiSearch.sh leen
# este archivo (formato `$var = valor`), así que mantener una var por línea.

env = EDITOR,nvim
$edit = ${EDITOR:-nano}
$term = kitty
$files = kitty --class taco -e taco   # taco, el explorador de discada (también abre las carpetas desde apps)
$Search_Engine = "https://www.google.com/search?q={}"
