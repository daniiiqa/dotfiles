# Look: bordes, gaps, rounding, sombras, blur — https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

# Custom (dany): look minimal — un solo acento (color12) en la ventana activa,
# el resto se funde con el fondo. Sin dim, sin sombras de color, blur ligero.
general {
  border_size = 1
  gaps_in = 4
  gaps_out = 8

  col.active_border = $color12
  col.inactive_border = rgba(00000000)
}

decoration {
  rounding = 6
  rounding_power = 2.4

  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_special = 0.4

  shadow {
    enabled = true
    range = 12
    render_power = 4
    offset = 0 4

    color = rgba(00000055)
    color_inactive = rgba(00000022)
  }

  blur {
    enabled = true
    size = 4
    passes = 2
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = false
  }
}

group {
  col.border_active = $color12
  col.border_inactive = rgba(00000000)

	groupbar {
		col.active = $color12
		col.inactive = $color0
  }
}
