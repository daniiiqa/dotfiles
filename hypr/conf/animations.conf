# Animaciones — https://wiki.hyprland.org/Configuring/Animations/

# Custom (dany): animaciones minimal — cortas, sin rebote ni overshoot
animations {
  enabled = yes

  bezier = snap, 0.2, 0.9, 0.1, 1
  bezier = ease, 0.25, 0.1, 0.25, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 3, snap, popin 96%
  animation = windowsIn, 1, 3, snap, popin 96%
  animation = windowsOut, 1, 2, ease, popin 96%
  animation = windowsMove, 1, 3, snap
  animation = border, 1, 3, ease
  animation = borderangle, 0
  animation = fade, 1, 2, ease
  animation = fadeDim, 1, 2, ease
  animation = layers, 1, 2, snap, fade
  animation = workspaces, 1, 3, snap, slidefade 8%
  animation = specialWorkspace, 1, 3, snap, slidevert
}
