# yazi — colores con nombres ANSI: salen de la paleta de kitty, así que cada
# look (y cada wallpaper vía wallust + ContrastFix) lo re-tiñe solo.

[mgr]
cwd             = { fg = "blue", bold = true }
hovered         = { reversed = true, bold = true }
preview_hovered = { underline = true }
find_keyword    = { fg = "yellow", bold = true, italic = true, underline = true }
find_position   = { fg = "magenta", bold = true, italic = true }
marker_copied   = { fg = "green", bg = "green" }
marker_cut      = { fg = "red", bg = "red" }
marker_marked   = { fg = "cyan", bg = "cyan" }
marker_selected = { fg = "yellow", bg = "yellow" }
count_copied    = { fg = "black", bg = "green" }
count_cut       = { fg = "black", bg = "red" }
count_selected  = { fg = "black", bg = "yellow" }
border_symbol   = "│"
border_style    = { fg = "bright_black" }

[tabs]
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "blue", bg = "reset" }

[mode]
normal_main = { fg = "black", bg = "blue", bold = true }
normal_alt  = { fg = "blue", bg = "reset" }
select_main = { fg = "black", bg = "magenta", bold = true }
select_alt  = { fg = "magenta", bg = "reset" }
unset_main  = { fg = "black", bg = "red", bold = true }
unset_alt   = { fg = "red", bg = "reset" }

[status]
perm_type  = { fg = "blue" }
perm_read  = { fg = "yellow" }
perm_write = { fg = "red" }
perm_exec  = { fg = "green" }
perm_sep   = { fg = "bright_black" }

[filetype]
rules = [
	{ mime = "image/*", fg = "yellow" },
	{ mime = "{audio,video}/*", fg = "magenta" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	{ mime = "application/{pdf,doc,rtf}", fg = "cyan" },
	{ url = "*/", fg = "blue", bold = true },
	{ url = "*", fg = "white" },
]

# Iconos: los de serie traen colores fijos; estos usan nombres ANSI para que
# también sigan al look. Mismos grupos de color que [filetype].
[icon]
globs = []
dirs  = [
	{ name = ".config", text = "", fg = "blue" },
	{ name = ".git", text = "", fg = "blue" },
	{ name = "Desktop", text = "", fg = "blue" },
	{ name = "Documents", text = "", fg = "blue" },
	{ name = "Downloads", text = "", fg = "blue" },
	{ name = "Music", text = "", fg = "blue" },
	{ name = "Pictures", text = "", fg = "blue" },
	{ name = "Videos", text = "", fg = "blue" },
	{ name = "Games", text = "󰊴", fg = "blue" },
	{ name = "Projects", text = "", fg = "blue" },
]
files = []
exts  = [
	# imágenes
	{ name = "png", text = "", fg = "yellow" },
	{ name = "jpg", text = "", fg = "yellow" },
	{ name = "jpeg", text = "", fg = "yellow" },
	{ name = "webp", text = "", fg = "yellow" },
	{ name = "gif", text = "", fg = "yellow" },
	{ name = "svg", text = "", fg = "yellow" },
	# audio
	{ name = "mp3", text = "", fg = "magenta" },
	{ name = "flac", text = "", fg = "magenta" },
	{ name = "wav", text = "", fg = "magenta" },
	{ name = "ogg", text = "", fg = "magenta" },
	# video
	{ name = "mp4", text = "", fg = "magenta" },
	{ name = "mkv", text = "", fg = "magenta" },
	{ name = "webm", text = "", fg = "magenta" },
	{ name = "mov", text = "", fg = "magenta" },
	# comprimidos
	{ name = "zip", text = "", fg = "red" },
	{ name = "7z", text = "", fg = "red" },
	{ name = "rar", text = "", fg = "red" },
	{ name = "tar", text = "", fg = "red" },
	{ name = "gz", text = "", fg = "red" },
	{ name = "xz", text = "", fg = "red" },
	{ name = "zst", text = "", fg = "red" },
	# documentos
	{ name = "pdf", text = "", fg = "cyan" },
	# notas
	{ name = "md", text = "", fg = "cyan" },
	# texto
	{ name = "txt", text = "", fg = "white" },
	{ name = "log", text = "", fg = "white" },
	# código / config
	{ name = "sh", text = "", fg = "green" },
	{ name = "py", text = "", fg = "green" },
	{ name = "rs", text = "", fg = "green" },
	{ name = "c", text = "", fg = "green" },
	{ name = "h", text = "", fg = "green" },
	{ name = "lua", text = "", fg = "green" },
	{ name = "gd", text = "", fg = "green" },
	{ name = "js", text = "", fg = "green" },
